# TLS terminator overlay (civora-org/civora-platform#168, ADR-011): Caddy in
# front of the app with automatic Let's Encrypt certificates, HTTPS-only.
# Usable for any single-host stack, production included:
#
#   docker compose -f compose.yaml -f compose.tls.yml up -d
#   (or COMPOSE_FILE=compose.yaml:compose.tls.yml in .env, which the ops
#   scripts honor: deploy.sh, smoke_test.sh, backup.sh)
#
# Needs SITE_ADDRESS (public host name) and ACME_EMAIL in .env, and DNS for
# SITE_ADDRESS pointing at this machine with ports 80 and 443 reachable.
# For a *.localhost name Caddy issues from its own internal CA instead (local
# rehearsal, no DNS, no Let's Encrypt). Documented in docs/ops/tls.md.
services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (public host name)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt contact)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The admin API listens on localhost inside the container only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    environment:
      # Decidim forces SSL in production; this also sets HSTS and secure cookies,
      # and makes Decidim build https links in mail and feeds.
      DECIDIM_FORCE_SSL: "1"
    # Only Caddy is reachable from outside; port 3000 stays inside the compose
    # network. (Docker publishes ports around the host firewall, so leaving the
    # base `3000:3000` mapping would expose the app over plain HTTP.)
    # The base healthcheck still works: /up and /healthz are exempt from the
    # HTTP-to-HTTPS redirect (config/initializers/ssl_options.rb).
    ports: !reset []

volumes:
  caddy-data: {}
  caddy-config: {}
