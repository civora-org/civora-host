name: civora-host

services:
  app:
    build:
      context: .
      secrets:
        - github_token
    image: civora-host:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      # Release provenance, read by config/initializers/sentry.rb for the
      # GlitchTip release; scripts/deploy.sh exports it from git before
      # `docker compose up` (empty default keeps base-only usage working).
      GIT_REVISION: ${GIT_REVISION:-}
      # No TLS terminator in the baseline stack yet; remove this override
      # (Decidim then defaults to forcing SSL in production) once a reverse
      # proxy terminates HTTPS in front of app.
      DECIDIM_FORCE_SSL: "0"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/1
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - app-storage:/app/storage
      - app-log:/app/log
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI(\"http://127.0.0.1:3000/up\")).code == \"200\" ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Nightly CRZ sync (civora-org/civora-platform#138, docs/ops/crz-sync.md):
  # same image and wiring as `app`, no ports. Loops forever: sleep until
  # 03:30 Europe/Bratislava (02:30 does not exist on the spring-forward
  # night; the 03:15 backup runs first), run scripts/crz_sync_run.sh, repeat. The
  # .dockerignore keeps /scripts out of the image, so the scripts are
  # bind-mounted read-only from the checkout (like the observability configs).
  # The crz-sync-state volume sits on /app/tmp (rails-owned in the image, so a
  # fresh volume inherits the right ownership) and holds the per-organization
  # last-success cursor. Metrics go to pushgateway when the observability
  # overlay is active (non-fatal otherwise).
  scheduler:
    image: civora-host:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      RAILS_ENV: production
      TZ: Europe/Bratislava
      GIT_REVISION: ${GIT_REVISION:-}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/1
      CRZ_SYNC_STATE_DIR: /app/tmp/crz-sync
    command: ["sh", "scripts/crz_sync_scheduler.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ./scripts:/app/scripts:ro
      - crz-sync-state:/app/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: decidim_app_production
    volumes:
      - pg-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decidim_app_production"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  app-storage: {}
  app-log: {}
  pg-data: {}
  redis-data: {}
  crz-sync-state: {}

secrets:
  github_token:
    environment: GITHUB_TOKEN
