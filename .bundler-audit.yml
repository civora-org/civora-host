# bundler-audit configuration (auto-loaded; --config defaults to this file).
#
# POLICY: ignores are exhaustive per-advisory (never per-gem), so any NEW
# advisory not listed here still fails CI and forces a fresh disposition.
#
# Decidim 0.32.1 (Rails 8.1, civora-org/civora-platform#185) cleared the 15
# advisories that the 0.31.7 pins blocked: the ten rails 7.2 EOL CVEs
# (CVE-2026-33168, -33173, -33174, -33195, -33202, -33658, -66066, -33169,
# -33170, -33176), devise (CVE-2026-32700, CVE-2026-40295), shakapacker
# (GHSA-96qw-h329-v5rg) and puma (CVE-2026-47736, CVE-2026-47737). What is
# left is still blocked upstream by the decidim 0.32.1 pins:
# - graphql >= 2.6.9 is unresolvable under decidim-api's `< 2.6`;
# - rack-proxy >= 1.0.3 is unresolvable under decidim-core's `< 1.0`;
# - rubyzip >= 3.4.0 is unresolvable under decidim-core's `~> 2.0`.
# Everything else is fixed by `bundle update` within the constraints; this
# file only ever holds what is provably upstream-blocked.
# Pruned in civora-org/civora-platform#188: each entry below was re-run
# against an empty ignore list on 2026-10-13 and is still reported. The
# brakeman EOLRails ignore is gone (Rails 8.1). Exposure of each entry:
# docs/ops/security-updates.md. rubyzip: see "rubyzip mitigation" there.
# REVISIT: every entry, on the next Decidim upgrade that relaxes these pins
# (0.33 or a 0.32.x patch); review monthly.
# Mirrors .bundler-audit.yml in the engine (decidim-contracts_sk).
---
ignore:
  # graphql 2.5.26 (decidim-api pin): parser-cache Marshal deserialization
  - GHSA-rmxg-5p3r-j6hh
  # graphql 2.5.26: authorization bypass, but only for schemas that opt in to
  # the experimental Execution::Next runtime (context[:__graphql_execute_next]).
  # decidim-api never sets it and the host has no GraphQL code of its own, so
  # the default interpreter is the only path; first seen with the 0.32.1
  # resolution (fix needs graphql >= 2.6.6, blocked by `< 2.6`).
  - GHSA-j7xr-4g94-r9h3
  # rack-proxy 0.8.3 (decidim-core pin); also ignored in the engine
  - GHSA-42qh-8mx8-7wqm
  # rubyzip 2.3.2 (decidim-core pin): path traversal on extraction (High).
  # Only reachable through doc2text's ODT unpack in the admin participatory-
  # text import; mitigation in docs/ops/security-updates.md.
  - CVE-2026-85396
