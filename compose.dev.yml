# Development overlay: restores the bind-mount dev loop.
# Usage: docker compose -f compose.yaml -f compose.dev.yml up
services:
  app:
    image: decidim/decidim:0.31.7
    build: !reset null
    environment: !override
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ""
      REDIS_URL: redis://redis:6379/1
    volumes: !override
      - .:/app
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules
    command: bundle exec puma

  db:
    environment: !override
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: decidim_app_development

volumes:
  bundle: {}
  node_modules: {}
