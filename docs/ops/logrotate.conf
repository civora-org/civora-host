# Host logrotate snippet for the Civora backup cron log.
# See docs/ops/log-policy.md; install on the deploy host as e.g.
# /etc/logrotate.d/civora-backup.
#
# The cron job appends (>>) on each run, so it reopens the file every night —
# "create" is safe (no long-lived file handle, no copytruncate race needed).

/srv/civora-host/log/backup.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640
}
