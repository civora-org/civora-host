# Alertmanager routing (civora-org/civora-platform#51).
#
# Two receivers: Telegram for urgent alerts (critical/high — push to the
# maintainer's phone) and e-mail for every severity (the full record).
#
# Alertmanager config files cannot read env vars, so this file is mounted as a
# template (.yml.tmpl) and observability/alertmanager/entrypoint.sh
# substitutes the __PLACEHOLDERS__ from .env at container start. Unset values
# fall back to inert defaults: delivery attempts fail and are logged, and
# alerts stay browsable in the Alertmanager UI — the "log" fallback until the
# receivers are configured (see docs/ops/observability.md).
global:
  resolve_timeout: 5m
  smtp_smarthost: '__ALERT_SMTP_SMARTHOST__'
  smtp_from: '__ALERT_EMAIL_FROM__'
  smtp_auth_username: '__ALERT_SMTP_USERNAME__'
  smtp_auth_password: '__ALERT_SMTP_PASSWORD__'
  smtp_require_tls: true

# Message templates (templates/telegram.tmpl), mounted read-only.
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  # Catch-all: unknown severities still end up in the mailbox.
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Urgent: Telegram, then fall through so the alert is also e-mailed.
    - matchers:
        - severity =~ "critical|high"
      receiver: telegram
      continue: true
    - matchers:
        - severity =~ "critical|high|warning"
      receiver: email

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '__ALERT_TELEGRAM_BOT_TOKEN__'
        chat_id: __ALERT_TELEGRAM_CHAT_ID__
        parse_mode: HTML
        message: '{{ template "civora.telegram.message" . }}'
        send_resolved: true

  - name: email
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
