# Alert rules for the Civora host app (civora-org/civora-platform#51).
# Thresholds follow docs/05-operations/civora-ci-cd-plan.md ("Alerting Rules"):
#   critical — page immediately; high — notify within 1 hour; warning — minor.
# Metric names reflect prometheus_exporter defaults: the server applies the
# "ruby_" prefix, so the request counter is ruby_http_requests_total with a
# "status" label.
groups:
  - name: civora-availability
    rules:
      # Critical: uptime <95% in a 5-minute window (blackbox probe success rate).
      - alert: AppUptimeCritical
        expr: avg_over_time(probe_success{job="blackbox-up"}[5m]) < 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "App uptime below 95% (5m window)"
          description: "The blackbox probe of {{ $labels.instance }} succeeded only {{ $value | humanizePercentage }} of the time over the last 5 minutes."

      # High: uptime <99% in a 1-hour window.
      - alert: AppUptimeHigh
        expr: avg_over_time(probe_success{job="blackbox-up"}[1h]) < 0.99
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "App uptime below 99% (1h window)"
          description: "The blackbox probe of {{ $labels.instance }} succeeded only {{ $value | humanizePercentage }} of the time over the last hour."

      # Warning: deep health check failing (database or Redis unreachable).
      # /up still succeeding means the process is alive; a dependency is down.
      - alert: DeepHealthCheckFailing
        expr: probe_success{job="blackbox-healthz"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deep health check failing (/healthz)"
          description: "GET {{ $labels.instance }} is not returning 200 — database and/or Redis connectivity is broken."

  - name: civora-errors
    rules:
      # Critical: HTTP error rate >5% in a 5-minute window (5xx / total).
      - alert: HttpErrorRateCritical
        expr: |
          sum(rate(ruby_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(ruby_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate above 5% (5m window)"
          description: "{{ $value | humanizePercentage }} of requests returned 5xx over the last 5 minutes."

      # High: HTTP error rate >1% in a 1-hour window.
      - alert: HttpErrorRateHigh
        expr: |
          sum(rate(ruby_http_requests_total{status=~"5.."}[1h]))
            / sum(rate(ruby_http_requests_total[1h])) > 0.01
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "HTTP 5xx error rate above 1% (1h window)"
          description: "{{ $value | humanizePercentage }} of requests returned 5xx over the last hour."

  - name: civora-backup
    rules:
      # High: backup dead-man switch. scripts/backup.sh pushes
      # civora_backup_last_success_unixtime to pushgateway after every
      # successful run (cron: nightly 03:15 Europe/Bratislava). Alert when
      # the timestamp is stale for more than 26h (one missed night plus
      # margin) or has never been pushed.
      - alert: BackupStale
        expr: |
          (time() - civora_backup_last_success_unixtime > 93600)
            or absent(civora_backup_last_success_unixtime) == 1
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Backup has not succeeded for more than 26 hours"
          description: "No successful backup ping reached pushgateway within the last 26h (or none was ever pushed). Check the cron job and scripts/backup.sh output."

  - name: civora-crz-sync
    rules:
      # High: CRZ sync dead-man switch (civora-org/civora-platform#138).
      # scripts/crz_sync_run.sh pushes civora_crz_sync_last_success_unixtime
      # (grouping label organization=<id>) after every successful per-org
      # sync; the scheduler service runs nightly at 03:30 Europe/Bratislava.
      # Fires per organization when its last success is older than 54h (two
      # missed nights plus slack), and globally when nothing was ever pushed.
      # Failed runs push only civora_crz_sync_last_run_success=0, never the
      # timestamp.
      - alert: CrzSyncStale
        expr: |
          (time() - civora_crz_sync_last_success_unixtime > 194400)
            or absent(civora_crz_sync_last_success_unixtime) == 1
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "CRZ sync has not succeeded for more than 54 hours"
          description: "No successful CRZ sync reached pushgateway within the last 54h for organization {{ $labels.organization }} (or none was ever pushed). Check the scheduler service logs and docs/ops/crz-sync.md."

      # Warning: an organization whose sync has failed since it was first
      # seen has no success timestamp, so CrzSyncStale cannot see it
      # (e.g. no admin with accepted terms, so no import actor).
      - alert: CrzSyncNeverSucceeded
        expr: |
          civora_crz_sync_last_run_success == 0
            unless on(job, organization) civora_crz_sync_last_success_unixtime
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "CRZ sync has never succeeded for an organization"
          description: "The CRZ sync for organization {{ $labels.organization }} is failing and has never succeeded. Check the scheduler logs (for example a missing import actor) and docs/ops/crz-sync.md."
